name: Documentation

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz
          python -m pip install --requirement docs/requirements.txt

      - name: Validate current tutorials and Python stub reference
        run: sphinx-build -W --keep-going -b html docs/site docs/_build/html

      - name: Validate current Doxygen C++ reference
        run: |
          cmake -E make_directory docs/_build/html/cpp
          doxygen docs/Doxyfile.pages

      - name: Exercise versioned documentation assembly
        if: github.event_name == 'pull_request'
        run: |
          python docs/build_versions.py \
            --output docs/_build/versioned-smoke \
            --branches dev \
            --minimum-tag v999.0 \
            --default-ref dev \
            --base-path /moto/

      - name: Build versioned documentation site
        if: github.event_name != 'pull_request'
        run: |
          python docs/build_versions.py \
            --output docs/_build/html \
            --base-path /moto/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
